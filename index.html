<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinwheel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page">
        <section class="wheel-panel">
            <div class="wheel-stage">
                <div class="wheel-frame">
                    <div class="pointer" aria-hidden="true"></div>
                    <div class="wheel" id="spinwheel" aria-label="Prize wheel"></div>
                </div>
            </div>
            <button class="spin-button" id="spinButton" type="button">Spin</button>
        </section>
    </main>

    <script>
        const segmentValues = [
            "$10",
            "$25",
            "$50",
            "$100",
            "Try Again",
            "Bonus",
            "$75",
            "Jackpot"
        ];

        const segmentColors = [
            "#ff6b6b",
            "#ffd166",
            "#06d6a0",
            "#118ab2",
            "#f78c6b",
            "#83c5be",
            "#ef476f",
            "#26547c"
        ];

        const wheel = document.getElementById("spinwheel");
        const spinButton = document.getElementById("spinButton");
        const wheelPanel = wheel.closest(".wheel-panel");
        let currentRotation = 0;

        function buildWheel() {
            const segmentSize = 360 / segmentValues.length;
            const gradientStops = segmentColors.map((color, index) => {
                const start = index * segmentSize;
                const end = start + segmentSize;

                return `${color} ${start}deg ${end}deg`;
            });

            wheel.style.setProperty("--wheel-gradient", `conic-gradient(${gradientStops.join(", ")})`);

            segmentValues.forEach((value, index) => {
                const label = document.createElement("span");
                const text = document.createElement("span");
                const angle = index * segmentSize + segmentSize / 2;

                label.className = "wheel-label";
                label.style.transform = `rotate(${angle}deg)`;

                text.className = "wheel-label-text";
                text.textContent = value;
                text.style.transform = `rotate(${90}deg)`;

                label.appendChild(text);
                wheel.appendChild(label);
            });
        }

        function spinWheel() {
            const fullTurns = 6;
            const randomOffset = Math.floor(Math.random() * 360);
            const nextRotation = currentRotation + fullTurns * 360 + randomOffset;
            const spinUpPortion = 0.018;
            const spinUpRotation = currentRotation + (nextRotation - currentRotation) * spinUpPortion;

            wheel.style.setProperty("--spin-start", `${currentRotation}deg`);
            wheel.style.setProperty("--spin-up-end", `${spinUpRotation}deg`);
            wheel.style.setProperty("--spin-end", `${nextRotation}deg`);
            wheelPanel.classList.remove("is-zooming");
            wheel.classList.remove("is-spinning");
            void wheel.offsetWidth;
            wheelPanel.classList.add("is-zooming");
            wheel.classList.add("is-spinning");
            currentRotation = nextRotation % 360;
        }

        buildWheel();
        wheel.addEventListener("animationend", (event) => {
            if (event.animationName !== "wheel-spin-main") {
                return;
            }

            wheelPanel.classList.remove("is-zooming");
            wheel.classList.remove("is-spinning");
            wheel.style.transform = `rotate(${currentRotation}deg)`;
        });
        spinButton.addEventListener("click", spinWheel);
    </script>
</body>
</html>

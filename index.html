<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinwheel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page">
        <div class="view-switch" role="tablist" aria-label="Spinwheel views">
            <button class="view-tab is-active" id="playTab" type="button" role="tab" aria-controls="playView" aria-selected="true">Play</button>
            <button class="view-tab" id="editTab" type="button" role="tab" aria-controls="editView" aria-selected="false">Edit</button>
        </div>

        <section class="view view-play is-active" id="playView" role="tabpanel" aria-labelledby="playTab">
            <section class="wheel-panel">
                <div class="wheel-stage">
                    <div class="wheel-frame">
                        <div class="pointer" aria-hidden="true"></div>
                        <div class="wheel" id="spinwheel" aria-label="Prize wheel"></div>
                    </div>
                </div>
                <button class="spin-button" id="spinButton" type="button">Spin</button>
            </section>
        </section>

        <section class="view view-edit" id="editView" role="tabpanel" aria-labelledby="editTab" hidden>
            <div class="editor-card">
                <h2>Configure Wheel</h2>
                <p>Edit each segment's text and type. Type controls the segment color.</p>

                <ul id="segmentList" class="segment-list" aria-label="Wheel segments"></ul>

                <button type="button" id="addSegmentButton" class="add-button">+ Add Segment</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
